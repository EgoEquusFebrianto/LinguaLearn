name: CI

on: 
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend_react
    
    steps:
      - name: Chckout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend_react/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: TypeScript check
        run: npx tsc -b
      
      - name: Build frontend
        run: npm run build

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lingualearn
          MYSQL_USER: lingualearn
          MYSQL_PASSWORD: lingualearn
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      
      mongo:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: root
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend_golang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend_golang/go.mod
          cache: true

      - name: Create CI environment
        run: |
          cat > .env <<'EOF'
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_USER=lingualearn
          DB_PASSWORD=lingualearn
          DB_NAME=lingualearn

          MONGO_URL=mongodb://127.0.0.1:27017
          MONGO_USER=lingualearn
          MONGO_PASSWORD=lingualearn
          MONGO_NAME=lingualearn

          REDIS_ADDR=127.0.0.1:6379
          REDIS_PASSWORD=
          REDIS_DB=0

          SERVER_ADDRESS=:8080

          JWT_ACCESS_SECRET=ci-test-secret
          JWT_ACCESS_EXPIRES_MINUTES=15
          JWT_REFRESH_EXPIRES_DAYS=7
          EOF

      - name: Initialize MongoDB test user
        working-directory: backend_golang
        run: |
          docker exec ${{ job.services.mongo.id }} mongosh \
            --username root \
            --password root \
            --authenticationDatabase admin \
            --eval '
              db = db.getSiblingDB("lingualearn");
              db.createUser({
                user: "lingualearn",
                pwd: "lingualearn",
                roles: [{ role: "readWrite", db: "lingualearn" }]
              });
            '
      - name: Run Go tests
        run: make test
        
      - name: Build backend
        run: make build