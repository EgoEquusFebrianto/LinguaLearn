name: CI

on: 
  pull_request:
      branches:
          - main

jobs:    
    backend:
        name: Backend CI
        runs-on: ubuntu-latest

        defaults:
          run:
            working-directory: backend_golang
            
        steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Setup Go
            uses: actions/setup-go@v5
            with:
              go-version-file: backend_golang/go.mod
              cache: true

          - name: Run Go tests
            run: make test
            
          - name: Build backend
            run: make build

    frontend:
        name: Frontend CI
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend_react
        
        steps:
            - name: Chckout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: frontend_react/package-lock.json
            
            - name: Install dependencies
              run: npm ci
            
            - name: TypeScript check
              run: npx tsc -b
            
            - name: Build frontend
              run: npm run build